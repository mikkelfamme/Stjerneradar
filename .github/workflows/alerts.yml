name: Stjerneradar - Varsler
on:
  schedule:
    # Undgår minut 0 og meget travle GitHub Actions-tidspunkter.
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Send testbesked (kun kl. 07-23 pa varslingsstedet)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Kun test af beregning - send ikke ntfy-beskeder'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: stjerneradar-alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer kun beregningsbiblioteker på GitHub
        run: npm install --no-audit --no-fund
      - name: Test varslingsregler (herunder stilleperiode)
        run: npm test
      - name: Beregn udsigt og send ntfy-varsler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STJERNERADAR_ALERT_CONFIG: ${{ secrets.STJERNERADAR_ALERT_CONFIG }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          APP_URL: ${{ vars.STJERNERADAR_APP_URL }}
          TEST_MESSAGE: ${{ inputs.test_message || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/run-alerts.mjs
